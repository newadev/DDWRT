name: Build OpenWrt
run-name: Build OpenWrt (${{ inputs.device || 'x86_64' }})
'on':
  workflow_dispatch:
    inputs:
      device:
        description: '目标设备'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - netcore-n60-pro
          - cudy-tr3000-v1
          - glinet-gl-mt3000
          - 360-t7
      clean:
        description: '全新编译 (不使用缓存)'
        type: boolean
        default: false
      source_ref:
        description: '固定 OpenWrt 源码提交 SHA（留空使用分支最新版本）'
        type: string
        default: ''

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Singapore

permissions:
  contents: write
  actions: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    concurrency:
      group: build-${{ inputs.device || 'x86_64' }}
      cancel-in-progress: true
    
    steps:
    #--------------------------------------------------
    # 准备阶段
    #--------------------------------------------------
    - name: 检出代码
      uses: actions/checkout@v6

    - name: 解析设备参数
      id: device
      env:
        DEVICE_INPUT: ${{ inputs.device }}
      run: |
        DEVICE="${DEVICE_INPUT:-x86_64}"
        
        # 设备映射表 (Target|Subtarget|Arch|Profile)
        declare -A DEVICES=(
          ["x86_64"]="x86|64|x86_64|generic"
          ["netcore-n60-pro"]="mediatek|filogic|aarch64_cortex-a53|netcore_n60-pro"
          ["cudy-tr3000-v1"]="mediatek|filogic|aarch64_cortex-a53|cudy_tr3000-v1"
          ["glinet-gl-mt3000"]="mediatek|filogic|aarch64_cortex-a53|glinet_gl-mt3000"
          ["360-t7"]="mediatek|filogic|aarch64_cortex-a53|qihoo_360t7-ubi"
        )
        
        if [ -z "${DEVICES[$DEVICE]:-}" ]; then
          echo "❌ 未知设备: $DEVICE" >&2
          exit 1
        fi
        
        IFS='|' read -r TARGET SUBTARGET ARCH PROFILE <<< "${DEVICES[$DEVICE]}"
        
        {
          echo "device=$DEVICE"
          echo "target=$TARGET"
          echo "subtarget=$SUBTARGET"
          echo "arch=$ARCH"
          echo "profile=$PROFILE"
        } >> "$GITHUB_OUTPUT"
        echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

    - name: 释放磁盘空间 (Maximize Build Space)
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"
        rmz_version: "3.1.1"

    - name: 初始化环境
      run: |
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lld llvm lrzsz mkisofs msmtp \
          nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-pyelftools \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo mkdir -p /workdir
        sudo chown "$(id -u):$(id -g)" /workdir

    #--------------------------------------------------
    # 源码阶段
    #--------------------------------------------------
    - name: 克隆源码
      working-directory: /workdir
      env:
        SOURCE_REF: ${{ inputs.source_ref }}
      run: |
        git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
        if [[ -n "$SOURCE_REF" ]]; then
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'ERROR: source_ref must be a full 40-character commit SHA' >&2
            exit 1
          fi
          git -C openwrt fetch --depth=1 origin "$SOURCE_REF"
          git -C openwrt checkout --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = "$SOURCE_REF"
        fi
        ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
        cd openwrt
        {
          echo "SRC=$PWD"
          echo "HASH=$(git rev-parse --short=12 HEAD)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          echo "CCACHE_DIR=$PWD/.ccache"
        } >> "$GITHUB_ENV"

    #--------------------------------------------------
    # 缓存阶段
    #--------------------------------------------------
    # Only cache self-validating compiler outputs and downloads. Partial
    # staging_dir caches omit build stamps and can mix incompatible toolchains.
    - name: 恢复 ccache 缓存
      if: ${{ inputs.clean != true }}
      uses: actions/cache@v5
      with:
        path: /workdir/openwrt/.ccache
        key: cc-v2-${{ runner.os }}-${{ steps.device.outputs.arch }}-${{ env.REPO_BRANCH }}-${{ env.HASH }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cc-v2-${{ runner.os }}-${{ steps.device.outputs.arch }}-${{ env.REPO_BRANCH }}-${{ env.HASH }}-
          cc-v2-${{ runner.os }}-${{ steps.device.outputs.arch }}-${{ env.REPO_BRANCH }}-

    - name: 恢复 dl 缓存
      if: ${{ inputs.clean != true }}
      uses: actions/cache@v5
      with:
        path: /workdir/openwrt/dl
        key: dl-v2-${{ hashFiles('devices/**/feeds.conf') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          dl-v2-${{ hashFiles('devices/**/feeds.conf') }}-
          dl-v2-

    #--------------------------------------------------
    # 配置阶段
    #--------------------------------------------------
    - name: 准备和加载 Feeds
      run: |
        bash "$GITHUB_WORKSPACE/tools/prepare-source.sh" "$DEVICE" "$SRC" feeds

    - name: 更新 Feeds
      run: cd "$SRC" && ./scripts/feeds update -a

    - name: 安装 Feeds
      run: cd "$SRC" && ./scripts/feeds install -a

    - name: 应用自定义脚本和补丁
      run: |
        bash "$GITHUB_WORKSPACE/tools/prepare-source.sh" "$DEVICE" "$SRC" customize

    - name: 生成配置
      env:
        TARGET: ${{ steps.device.outputs.target }}
        SUBTARGET: ${{ steps.device.outputs.subtarget }}
        PROFILE: ${{ steps.device.outputs.profile }}
      run: |
        cd "$SRC"
        bash "$GITHUB_WORKSPACE/tools/merge-config.sh" \
          "$GITHUB_WORKSPACE/devices/common/base.config" \
          "$GITHUB_WORKSPACE/devices/$DEVICE/target.config" > .config.requested
        cp .config.requested .config
        make defconfig
        bash "$GITHUB_WORKSPACE/tools/validate-config.sh" .config "CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${PROFILE}" .config.requested
        ./scripts/diffconfig.sh > config.seed
        ./scripts/feeds list -s > feeds.buildinfo

    - name: 复制自定义文件 (Files)
      run: |
        bash "$GITHUB_WORKSPACE/tools/prepare-source.sh" "$DEVICE" "$SRC" files

    #--------------------------------------------------
    # 编译阶段
    #--------------------------------------------------
    - name: 下载软件包
      run: |
        cd "$SRC"
        make download -j"$(nproc)" 2>&1 | tee download.log || make download -j1 V=s 2>&1 | tee -a download.log

    - name: 编译固件
      id: compile
      run: |
        cd "$SRC"
        make -j"$(nproc)" BUILD_LOG=1 2>&1 | tee build.log || make -j1 V=s BUILD_LOG=1 2>&1 | tee -a build.log
        echo "status=success" >> "$GITHUB_OUTPUT"

    #--------------------------------------------------
    # 发布阶段
    #--------------------------------------------------
    - name: 整理固件
      if: steps.compile.outputs.status == 'success'
      env:
        TARGET: ${{ steps.device.outputs.target }}
        SUBTARGET: ${{ steps.device.outputs.subtarget }}
      run: |
        bash "$GITHUB_WORKSPACE/tools/prepare-artifacts.sh" "$SRC/bin/targets/$TARGET/$SUBTARGET" "$SRC/firmware"
        {
          echo "FIRMWARE=$SRC/firmware"
          echo "BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')"
        } >> "$GITHUB_ENV"

    - name: 上传构建配置
      if: steps.compile.outputs.status == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: build-config-${{ steps.device.outputs.device }}-${{ env.HASH }}-${{ github.run_attempt }}
        path: |
          /workdir/openwrt/config.seed
          /workdir/openwrt/feeds.buildinfo
          /workdir/openwrt/bin/targets/${{ steps.device.outputs.target }}/${{ steps.device.outputs.subtarget }}/*.buildinfo
          /workdir/openwrt/bin/targets/${{ steps.device.outputs.target }}/${{ steps.device.outputs.subtarget }}/*.manifest
          /workdir/openwrt/bin/targets/${{ steps.device.outputs.target }}/${{ steps.device.outputs.subtarget }}/profiles.json
        retention-days: 7

    - name: 上传 Artifacts
      if: steps.compile.outputs.status == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.device.outputs.device }}-${{ env.HASH }}-${{ github.run_attempt }}
        path: ${{ env.FIRMWARE }}
        if-no-files-found: error
        retention-days: 7

    - name: 发布 Release
      if: steps.compile.outputs.status == 'success'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.device.outputs.device }}-${{ github.run_number }}
        name: ${{ steps.device.outputs.device }} (${{ env.HASH }})
        target_commitish: ${{ github.sha }}
        fail_on_unmatched_files: true
        body: |
          ### 固件构建信息
          - **设备型号**: `${{ steps.device.outputs.device }}`
          - **目标平台**: `${{ steps.device.outputs.target }}/${{ steps.device.outputs.subtarget }}`
          - **设备 Profile**: `${{ steps.device.outputs.profile }}`
          - **源码版本**: [openwrt@${{ env.HASH }}](https://github.com/openwrt/openwrt/commit/${{ env.SOURCE_SHA }})
          - **构建序号**: `#${{ github.run_number }}`
          - **构建时间**: ${{ env.BUILD_DATE }} (UTC+8)

          > ⚠️ 刷机或系统升级前请先比对校验包内的 `sha256sums`，确保下载文件完整无损。
        files: ${{ env.FIRMWARE }}/*

    - name: 上传失败日志 (排错用)
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: failure-${{ steps.device.outputs.device || 'unknown' }}-${{ env.HASH || 'unknown' }}-${{ github.run_attempt }}
        path: |
          /workdir/openwrt/.config
          /workdir/openwrt/.config.requested
          /workdir/openwrt/config.seed
          /workdir/openwrt/feeds.buildinfo
          /workdir/openwrt/download.log
          /workdir/openwrt/build.log
          /workdir/openwrt/logs/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 3
