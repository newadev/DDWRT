name: Validate Project

'on':
  push:
    branches: [main]
    paths: ['.github/**', 'devices/**', 'tools/**', 'tests/**']
  pull_request:
    paths: ['.github/**', 'devices/**', 'tools/**', 'tests/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: 安装检查工具
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ruby ruby-minitest
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: 检查工作流和脚本
        run: |
          "$RUNNER_TEMP/actionlint/actionlint"
          shellcheck tools/*.sh devices/*/settings.sh
          git diff --check
      - name: 配置与构建流程回归测试
        run: ruby tests/project_test.rb
