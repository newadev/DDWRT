name: Cleanup Releases and Runs

on:
  schedule:
    - cron: '0 0 * * 0' # 每周日 00:00 UTC 自动执行
  workflow_dispatch: # 支持手动点击触发

permissions:
  contents: write # 需要权限以删除 Releases 和 Tags
  actions: write  # 需要权限以删除 Workflow Runs

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Older Releases and Tags
        uses: actions/github-script@v9
        with:
          script: |
            const keepPerDevice = 2; // 每个设备保留最新的版本数量
            console.log(`正在获取仓库的所有 Releases...`);
            
            // 分页获取所有的 releases (默认按创建时间倒序排列)
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            console.log(`共找到 ${releases.length} 个 Releases，策略配置为每种设备独立保留最新的 ${keepPerDevice} 个。`);
            
            // 按设备名称分组 (Tag 命名规范: <device>-<run_number>)
            const deviceReleases = {};
            for (const release of releases) {
              const match = release.tag_name ? release.tag_name.match(/^(.*?)-\d+$/) : null;
              const device = match ? match[1] : (release.tag_name || 'unknown');
              if (!deviceReleases[device]) {
                deviceReleases[device] = [];
              }
              deviceReleases[device].push(release);
            }

            console.log(`已发现设备分类: ${Object.keys(deviceReleases).join(', ')}`);

            // 针对每个设备分类，独立截取并删除多余的旧版本
            for (const [device, devRels] of Object.entries(deviceReleases)) {
              // 确保按发布时间从新到旧严格排序
              devRels.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const toDelete = devRels.slice(keepPerDevice);
              if (toDelete.length === 0) {
                console.log(`设备 [${device}] 共有 ${devRels.length} 个 Release，无需清理。`);
                continue;
              }

              console.log(`\n>>> 设备 [${device}] 正在清理 ${toDelete.length} 个历史 Release:`);
              for (const release of toDelete) {
                console.log(`  - 正在删除 Release: ${release.name || release.tag_name} (ID: ${release.id})`);
                
                // 1. 删除 Release
                try {
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: release.id
                  });
                } catch (error) {
                  console.warn(`    删除 Release 失败: ${error.message}`);
                }
                
                // 2. 尝试连带删除挂钩的 Git Tag
                if (release.tag_name) {
                  console.log(`    正在销毁关联的 Tag: ${release.tag_name}`);
                  try {
                    await github.rest.git.deleteRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: `tags/${release.tag_name}`
                    });
                  } catch (error) {
                    console.warn(`    销毁 Tag 失败 (可能已被删除): ${error.message}`);
                  }
                }
              }
            }
            console.log('\n✅ 各设备历史 Releases 和关联 Tags 清理任务完成！');

      - name: Delete Older Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3
