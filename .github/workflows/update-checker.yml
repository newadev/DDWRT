name: Check Source Update

'on':
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: source-update
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: 检出代码
      uses: actions/checkout@v6

    - name: 检查上游更新
      id: check
      shell: bash
      run: |
        NEW_HASH=$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | awk 'NR == 1 { print $1 }')
        if [[ ! "$NEW_HASH" =~ ^[0-9a-f]{40}$ ]]; then
          echo "ERROR: invalid upstream commit: $NEW_HASH" >&2
          exit 1
        fi
        LAST_HASH=""
        if [[ -f .last_source_hash ]]; then
          LAST_HASH=$(tr -d '[:space:]' < .last_source_hash)
        fi
        echo "new_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"
        if [[ "$LAST_HASH" == "$NEW_HASH" ]]; then
          echo "has_update=false" >> "$GITHUB_OUTPUT"
        else
          echo "has_update=true" >> "$GITHUB_OUTPUT"
        fi

    # Do not advance the watermark unless every dispatch was accepted.
    - name: 触发全部设备编译
      if: steps.check.outputs.has_update == 'true'
      uses: actions/github-script@v9
      env:
        NEW_HASH: ${{ steps.check.outputs.new_hash }}
      with:
        script: |
          const fs = require('fs');
          const devices = fs.readdirSync('devices')
            .filter(device => device !== 'common' && fs.existsSync('devices/' + device + '/target.config'))
            .sort();
          if (!devices.length) throw new Error('No configured devices found');
          for (const device of devices) {
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: context.ref.replace('refs/heads/', ''),
              inputs: { device, clean: 'false', source_ref: process.env.NEW_HASH }
            });
          }
          await core.summary
            .addHeading('源码更新检测')
            .addRaw('已固定源码 ' + process.env.NEW_HASH + '，触发设备：' + devices.join(', '))
            .write();

    - name: 记录已触发的源码版本
      if: steps.check.outputs.has_update == 'true'
      env:
        NEW_HASH: ${{ steps.check.outputs.new_hash }}
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git pull --ff-only origin "$GITHUB_REF_NAME"
        printf '%s\n' "$NEW_HASH" > .last_source_hash
        git add .last_source_hash
        if ! git diff --cached --quiet; then
          git commit -m "chore: 更新源码版本记录 $NEW_HASH"
          git push origin "HEAD:$GITHUB_REF_NAME"
        fi
